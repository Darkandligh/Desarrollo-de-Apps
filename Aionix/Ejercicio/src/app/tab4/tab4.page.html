<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Catálogo de componentes</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Buscar componente..."
      [value]="termino()"
      (ionInput)="buscar($event)"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="catalogo-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Catálogo de componentes</ion-title>
    </ion-toolbar>
  </ion-header>

  <p class="contador">{{ filtrados().length }} de {{ componentes.length }} componentes</p>

  <ion-grid class="catalogo-grid">
    <ion-row>
      <ion-col size="12" sizeMd="6" sizeLg="4" *ngFor="let c of filtrados()">
        <ion-card [routerLink]="['/componentes', c.slug]" button class="tarjeta-componente">
          <ion-card-header>
            <div class="icono-wrap" [attr.color]="c.color">
              <ion-icon [name]="c.icono" [color]="c.color"></ion-icon>
            </div>
            <ion-card-title>{{ c.titulo }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>{{ c.descripcion }}</ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <p class="sin-resultados" *ngIf="!filtrados().length">
    No hay componentes que coincidan con "{{ termino() }}".
  </p>
</ion-content>
