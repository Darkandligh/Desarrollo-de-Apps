<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab4"></ion-back-button>
    </ion-buttons>
    <ion-title>Input (ion-input)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <p>Campo de texto de una línea.</p>

<ion-input label="Nombre" labelPlacement="floating" placeholder="Escribí tu nombre" [(ngModel)]="nombre"></ion-input>
<p>Hola {{ nombre || '...' }}</p>
</ion-content>
