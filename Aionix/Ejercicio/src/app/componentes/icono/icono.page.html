<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab4"></ion-back-button>
    </ion-buttons>
    <ion-title>Icon (ion-icon)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <p>Íconos de la librería Ionicons, coloreables y de tamaño configurable.</p>

<ion-icon name="heart" color="danger" style="font-size: 32px"></ion-icon>
<ion-icon name="star" color="warning" style="font-size: 32px"></ion-icon>
<ion-icon name="home" color="primary" style="font-size: 32px"></ion-icon>
</ion-content>
